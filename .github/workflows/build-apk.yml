name: Build KawalSales APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses and install SDK 36.1
        shell: bash
        run: |
          set +o pipefail
          mkdir -p "${ANDROID_HOME}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_HOME}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${ANDROID_HOME}/licenses/android-sdk-preview-license"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            yes | "$SDKMANAGER" --install "platform-tools" "platforms;android-36.1" "build-tools;36.0.0" || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Locate generated APK
        run: |
          APK_PATH=$(find . -path "*/outputs/apk/debug/*.apk" | head -n 1)
          echo "Found APK: $APK_PATH"
          test -n "$APK_PATH"
          cp "$APK_PATH" KawalSales.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KawalSales-APK
          path: KawalSales.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk KawalSales.apk --clobber
          else
            gh release create latest-apk KawalSales.apk \
              --title "KawalSales APK (Terbaru)" \
              --notes "APK KawalSales otomatis dibuild dari GitHub Actions." \
              --target "${{ github.ref_name }}"
          fi
