name: Build KawalSales APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Prepare debug keystore and env
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk KawalSales.apk

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KawalSales-APK
          path: KawalSales.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk KawalSales.apk --clobber
          else
            gh release create latest-apk KawalSales.apk \
              --title "KawalSales APK (Terbaru)" \
              --notes "APK KawalSales otomatis dibuild dari GitHub Actions (commit ${{ github.sha }})." \
              --target "${{ github.ref_name }}"
          fi
